# Read-only access for the troubleshooter. Secrets are left out on purpose:
# Kubernetes itself refuses them, whatever the app does.
apiVersion: v1
kind: Namespace
metadata:
  name: troubleshooter
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: troubleshooter
  namespace: troubleshooter
---
apiVersion: v1
kind: Secret
metadata:
  name: troubleshooter-token
  namespace: troubleshooter
  annotations:
    kubernetes.io/service-account.name: troubleshooter
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: troubleshooter-look
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, endpoints, configmaps, nodes, namespaces,
                persistentvolumes, persistentvolumeclaims, resourcequotas, limitranges,
                replicationcontrollers, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [apps, batch, autoscaling, policy, networking.k8s.io, storage.k8s.io,
                discovery.k8s.io, events.k8s.io, metrics.k8s.io, apiextensions.k8s.io,
                rbac.authorization.k8s.io, crd.antrea.io, cns.vmware.com]
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: troubleshooter-look
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: troubleshooter-look
subjects:
  - kind: ServiceAccount
    name: troubleshooter
    namespace: troubleshooter
